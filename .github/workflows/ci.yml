name: CI

# Three tiers, on purpose.
#
#   offline      — the full offline suite list, executed by `node test/run-all.mjs`
#                  (see test/suites.mjs — the single roster both this job and
#                  `npm test` read; the build-gate tail is a real tsdown build
#                  of src/ into lib/ + client.js). The runner reports EVERY
#                  suite's verdict and exits non-zero if any failed, which is
#                  the point: this job used to be a `set -e` chain, so the
#                  second suite failing hid the other seventeen — including
#                  build-gate — and "the gate is red" was indistinguishable
#                  from "the gate is not verifying" (PITFALLS §30 root cause 2,
#                  filed against this very job). `e2e-gate` is skipped here
#                  because the end-to-end tier is its own job below; the rest of
#                  the roster is identical, and `test/package.test.mjs` pins that
#                  the *.test.mjs set is the same on both sides.
#                  These are the real gate: they stub the network
#                  (test/peer-roots.mjs installs a sentinel that fails any
#                  request escaping a stub), so a red here is always a regression.
#                  They also need a HOST RUNTIME, which a clean runner does not
#                  have: the suites import the Host's own packages as PEERS (see
#                  the install step below — this is the one job that must obtain
#                  them, and a green run that "SKIPped" them would be a gate that
#                  tests nothing).
#   e2e          — boots a REAL `dsh web` process against a fake platform. It proves
#                  the loader, routes, and trust fence assemble correctly — the class
#                  of bug the offline suites cannot see. It needs the dsh CLI, a host
#                  that can bind loopback ports, AND the BUILT artifacts (`lib/index.js`,
#                  root `client.js`) — so this job builds them itself before booting,
#                  which is also what proves a checkout that carries no built lib
#                  still activates once the build has run. A HARD GATE since 2026-10-02:
#                  it runs the same `test/e2e-gate.mjs` that ends the local `npm test`, so an
#                  environment that cannot host dsh prints a loud SKIP and exits 0
#                  (never a false red), while a run that does host it FAILS the build.
#                  This plugin's worst bug (a nested `auth:` block posting a REAL
#                  login to the platform) was caught only by e2e — the offline job
#                  above stubs the network, so it could never have seen it.
#   live-contract— MOVED OUT to `.github/workflows/live-contract.yml` (2026-10-16).
#                  It replays the frozen SenseNova inference contract against the
#                  LIVE platform (`test/live-contract.mjs`), so a platform dialect
#                  drift (a renamed field, a flipped 400, a new modality spelling)
#                  shows up at all. The reason it left this file is in that file's
#                  header, and it is the same argument rostro to PITFALLS §30:
#                  a check nobody reads might as well not run. As a `continue-on-error`
#                  job on every push, a red here was correctly nobody's regression
#                  and therefore never got looked at — while sharing a page with the
#                  offline hard gate, whose red means exactly the opposite. It now
#                  runs on `schedule` (drift is time-dependent, not commit-dependent)
#                  in a workflow whose only job is that one run, so its failure is
#                  the deliverable rather than noise next to a real gate. Still not
#                  a gate on your push; still needs the `SENSENOVA_API_KEY` secret,
#                  without which it SKIPs loudly (test/live-contract.mjs header).
#
# The e2e suite also runs inside `npm test` locally via test/e2e-gate.mjs, which
# SKIPs cleanly when the CLI is absent; this workflow keeps a separate, explicit
# signal for it rather than hiding it behind a green offline run.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  offline:
    name: Offline suites (hard gate)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '24']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          # No lockfile by design (the peerDependencies cannot resolve from any
          # registry), so the npm cache keys off package.json instead.
          cache: npm
          cache-dependency-path: package.json
      # Commit floor (zero-dep, test/commit-lint.mjs): checks the new commit
      # subjects in origin/main..HEAD. It is a hard signal of a *message*
      # regression, orthogonal to the suites — a bad message should not hide
      # behind a green test run. Unresolvable base ref → it lints HEAD and says
      # so, so it never hard-fails on a fetch quirk.
      - name: Commit floor (message conventions)
        run: |
          git fetch --depth=200 origin main || true
          node test/commit-lint.mjs --range origin/main..HEAD
      # The offline suites run on bare node (they import the src/*.ts sources
      # directly via native type stripping). This install exists for the THREE
      # build-shaped gates, not one: build-gate (tsdown, the real build),
      # typecheck-gate (typescript, the local pinned compiler), and
      # duplication-gate (jscpd, the clone scan). Without it, typecheck and
      # duplication would silently SKIP and only the build gate would be real.
      # --legacy-peer-deps is
      # mandatory — the plugin's peerDependencies are Host-runtime packages, and
      # a range install of them cannot succeed anyway (their published `latest`
      # tags are prereleases, which `>=0.1.5 <0.3` does not match under npm's
      # default semver rules).
      - name: Install dev dependencies (tsdown/typescript/jscpd, for the build-shaped gates)
        run: npm install --legacy-peer-deps --no-audit --no-fund
      # The suites resolve the Host's own packages as PEERS through
      # test/peer-roots.mjs, and `--legacy-peer-deps` deliberately SKIPS peer
      # dependencies — so a clean runner has none, and the FIRST
      # peer-dependent suite (`store.test.mjs`, second in the roster) threw
      # "cannot resolve the peer dependency @deepseek-ai/dsh-credentials" on
      # every push, for a day. Under the old `set -e` chain that ALSO hid the
      # other seventeen suites' verdicts, so the log said one thing and the
      # gate had verified almost nothing (PITFALLS §30 root causes 2 and 3;
      # root cause 2's fix landed with run-all.mjs, not with this install).
      #
      # Installing two or three packages from the registry does NOT fix it: the
      # DSH package set resolves its own internals through peers as well
      # (`dsh-credentials-local/lib/index.js` imports `@deepseek-ai/dsh-atomic-write`),
      # so a partial install only moves the failure. The complete,
      # version-consistent source is the CLI's own install tree — exactly what
      # the e2e job below already uses and what `cliRuntimeModules()` in
      # test/peer-roots.mjs now falls back to. Installed GLOBALLY on purpose:
      # a global install does not read this repo's manifest, so npm is free to
      # pull the runtime's own peer closure.
      #
      # That global install measured 33-41 s on ubuntu-latest and unpacks the
      # SAME tree every run (the CLI's version comes from the registry's
      # `latest` tag, not from this repo), so the steps below give npm's global
      # prefix a cacheable home and let actions/cache carry the tree between
      # runs; the install then only happens on a cache miss. Keyed on the
      # resolved version, so a new CLI release misses by construction instead
      # of restoring a tree whose `@deepseek-ai/dsh-base` no longer matches.
      #
      # NPM_CONFIG_PREFIX goes through `$GITHUB_ENV` rather than an `.npmrc`
      # because the environment variable outranks the config file, and
      # `$PREFIX/bin` goes onto PATH in the same step: `test/e2e-gate.mjs`
      # treats the CLI as present only when BOTH `dsh --version` runs AND
      # `npm root -g` resolves a tree carrying `@deepseek-ai/dsh-base`, so
      # moving the prefix without the shim splits exactly those two (the
      # gate's own "usual cause" line) and turns its hard gate into a SKIP.
      - name: Point npm's global prefix at a cacheable directory
        run: |
          PREFIX="$RUNNER_TEMP/dsh-global"
          # Created up front so a cache miss does not end with actions/cache
          # warning that the save path never existed.
          mkdir -p "$PREFIX/bin"
          echo "NPM_CONFIG_PREFIX=$PREFIX" >> "$GITHUB_ENV"
          echo "$PREFIX/bin" >> "$GITHUB_PATH"

      - name: Resolve the host version the peer suites load
        id: dsh-version
        run: echo "version=$(npm view @deepseek-ai/dsh version)" >> "$GITHUB_OUTPUT"

      # restore/save are split rather than the combined `actions/cache`: the
      # combined action saves whatever the path holds at job teardown, so a run
      # whose install FAILED would persist an empty directory under this key
      # and every later run for the same CLI version would restore it forever
      # (a saved key is never overwritten). Saving only when the anchor below
      # was actually found keeps a bad run from poisoning the key.
      - name: Restore the cached Host runtime
        id: dsh-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/dsh-global
          key: dsh-runtime-${{ runner.os }}-node${{ matrix.node-version }}-${{ steps.dsh-version.outputs.version }}

      # The guard asks the question the suites actually ask — does the anchor
      # `peer-roots.mjs` checks exist — instead of trusting `cache-hit`. A
      # restored-but-truncated tree would report a hit and then fail every peer
      # suite for a reason that looks like a code regression.
      - name: Provide the Host runtime the peer suites resolve from
        id: dsh-runtime
        run: |
          echo "npm root -g -> $(npm root -g)"
          ANCHOR="$(npm root -g)/@deepseek-ai/dsh/node_modules/@deepseek-ai/dsh-base"
          if node -e "process.exit(require('node:fs').existsSync(process.argv[1]) ? 0 : 1)" "$ANCHOR"; then
            echo "cached runtime already present: $ANCHOR"
          else
            npm install -g @deepseek-ai/dsh || echo "dsh CLI not installable here; the peer suites will fail loudly (this gate must not pass without them)"
          fi
          # Only this decides whether the cache is written: an anchor still
          # missing after the install means there is nothing worth saving.
          if node -e "process.exit(require('node:fs').existsSync(process.argv[1]) ? 0 : 1)" "$ANCHOR"; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::the runtime anchor is still missing after install; the cache will not be saved"
          fi

      - name: Save the Host runtime for the next run
        if: steps.dsh-cache.outputs.cache-hit != 'true' && steps.dsh-runtime.outputs.present == 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/dsh-global
          key: ${{ steps.dsh-cache.outputs.cache-primary-key }}
      - name: Run the offline suites
        run: node test/run-all.mjs --skip=e2e-gate

  e2e:
    name: End-to-end (hard gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # The bundle's two entries are BUILT ARTIFACTS (`lib/index.js`, root
      # `client.js`). They are VERSIONED in git (ADR-005), so this job still
      # builds them before booting rather than trusting the checkout: that is
      # what proves a checkout which carries no built lib (a shallow or
      # artifact-less copy) still activates the bundle once the build has run.
      - name: Install dev dependencies (tsdown, for the build)
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Build the artifacts the bundle ships
        run: npm run build
      # The e2e gate spawns `dsh web`; without the CLI it prints a loud SKIP and
      # exits 0. That SKIP is legitimate on a machine that genuinely cannot host
      # dsh, but this job is the "hard gate": the CLI install failing must NOT
      # silently degrade it into a SKIP-green run — the gate exists precisely to
      # fail when the Host assembly is broken, and a run that never boots a Host
      # proved nothing. So the install and the executable are verified HERE, and
      # the job goes red when either fails; only a dsh that runs reaches the gate.
      #
      # Same cached prefix as the offline job (see the long note there), but the
      # guard differs by one clause: here the `dsh` SHIM is load-bearing, because
      # this is the job that actually spawns it. A cache hit therefore only
      # counts when the anchor exists AND `dsh --version` runs — otherwise the
      # restore would have "succeeded" while handing the gate the exact
      # split-prefix condition it skips on. The `node22` in the key is literal on
      # purpose: it matches the offline job's node-22 leg, so the two jobs share
      # one entry instead of unpacking the tree twice.
      - name: Point npm's global prefix at a cacheable directory
        run: |
          PREFIX="$RUNNER_TEMP/dsh-global"
          mkdir -p "$PREFIX/bin"
          echo "NPM_CONFIG_PREFIX=$PREFIX" >> "$GITHUB_ENV"
          echo "$PREFIX/bin" >> "$GITHUB_PATH"

      - name: Resolve the host version this job boots
        id: dsh-version
        run: echo "version=$(npm view @deepseek-ai/dsh version)" >> "$GITHUB_OUTPUT"

      - name: Restore the cached DSH CLI
        id: dsh-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/dsh-global
          key: dsh-runtime-${{ runner.os }}-node22-${{ steps.dsh-version.outputs.version }}

      - name: Provide the dsh CLI (fail loudly if it cannot run)
        id: dsh-runtime
        run: |
          echo "npm root -g -> $(npm root -g)"
          ANCHOR="$(npm root -g)/@deepseek-ai/dsh/node_modules/@deepseek-ai/dsh-base"
          have_runtime() { node -e "process.exit(require('node:fs').existsSync(process.argv[1]) ? 0 : 1)" "$ANCHOR"; }
          if have_runtime && dsh --version >/dev/null 2>&1; then
            echo "cached CLI already present and runnable: $(command -v dsh)"
          else
            npm install -g @deepseek-ai/dsh || { echo "dsh CLI install failed — the e2e gate cannot run; failing loudly"; exit 1; }
          fi
          # Proof of a RUNNABLE CLI, not just a successful install: a broken shim
          # must also fail this job instead of letting e2e-gate SKIP green. It
          # runs on the cache-hit path too, because that path never installed
          # anything — the shim's presence is exactly what the cache had to
          # preserve.
          dsh --version >/dev/null || { echo "dsh CLI does not run — the e2e gate cannot run; failing loudly"; exit 1; }
          # Cache only a CLI the gate would really use: saving a broken one would
          # keep this job red on every later run for a stale reason.
          echo "present=true" >> "$GITHUB_OUTPUT"

      - name: Save the DSH CLI for the next run
        if: steps.dsh-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/dsh-global
          key: ${{ steps.dsh-cache.outputs.cache-primary-key }}
      - name: Run the end-to-end suite (hard gate)
        run: node test/e2e-gate.mjs

  build-freshness:
    name: Build artifacts are versioned & fresh (hard gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # `lib/` and root `client.js` are VERSIONED (committed alongside src/), not
      # git-ignored: the DSH marketplace's `github:` install source is a pnpm
      # git-dep, and pnpm 11 won't run prepack/prepare without build approval —
      # an un-versioned lib/ means a GitHub-direct install ships without its host
      # entry and the card silently dies. This job proves the committed artifact
      # is exactly what `src/` rebuilds (docs/issues/19, same decision as the
      # dsh-connect-qoder sibling). A diff here means the sources moved without
      # regenerating the artifact (or the artifact was hand-edited).
      - name: Install dev dependencies (tsdown, for the build)
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Rebuild lib/ + client.js from src/
        run: npm run build
      - name: The committed lib/ matches a fresh build
        run: git diff --exit-code -- lib client.js
      # The build must also be byte-stable inside the environment: build twice and
      # require equality. That is what makes the freshness gate above trustworthy
      # across machines — if a rebuild were not byte-stable, the `git diff` check
      # could not be relied on to point at a real drift.
      - name: The build is reproducible (build twice, compare)
        run: |
          cp -r lib lib.first
          cp client.js client.first.js
          npm run build
          diff -r lib.first lib
          diff client.first.js client.js

# The live platform contract no longer lives in this file — see
# `.github/workflows/live-contract.yml` (and the tier list above).
