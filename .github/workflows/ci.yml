name: CI

# Three tiers, on purpose.
#
#   offline      — the full offline suite list (see package.json's `test` script,
#                  plus the build-gate tail: a real tsdown build of src/ into
#                  lib/ + client.js). The *.test.mjs roster is pinned three ways
#                  by test/package.test.mjs: disk ↔ `test` script ↔ this job, so a
#                  suite that is written but not gated, or gated but not run here,
#                  goes red instead of rotting silently. The gate file itself is
#                  not a *.test.mjs (same exemption as e2e-gate) and is listed
#                  explicitly below.
#                  These are the real gate: they stub the network
#                  (test/peer-roots.mjs installs a sentinel that fails any
#                  request escaping a stub), so a red here is always a regression.
#                  They also need a HOST RUNTIME, which a clean runner does not
#                  have: the suites import the Host's own packages as PEERS (see
#                  the install step below — this is the one job that must obtain
#                  them, and a green run that "SKIPped" them would be a gate that
#                  tests nothing).
#   e2e          — boots a REAL `dsh web` process against a fake platform. It proves
#                  the loader, routes, and trust fence assemble correctly — the class
#                  of bug the offline suites cannot see. It needs the dsh CLI, a host
#                  that can bind loopback ports, AND the BUILT artifacts (`lib/index.js`,
#                  root `client.js`) — both gitignored, so this job must build them
#                  itself; a fresh checkout has neither entry and the loader silently
#                  drops it. It is best-effort: it reports its result without turning
#                  the build red when the environment cannot support it.
#   live-contract— replays the frozen SenseNova inference contract against the LIVE
#                  platform (`test/live-contract.mjs`), so a platform dialect drift
#                  (a renamed field, a flipped 400, a new modality spelling) shows
#                  red the day it happens instead of on the next manual run. Needs
#                  the `SENSENOVA_API_KEY` repo secret (owner-injected, never in
#                  the code); without it the suite SKIPs loudly and exits 0 — the
#                  same shape as e2e's missing-dsh-CLI skip. Red here is
#                  INFORMATION, not a regression (the fix belongs in the comment
#                  layer, docs/SENSENOVA-API.md §7), which is why it is best-effort
#                  too and never gates the offline job.
#
# The e2e suite also runs inside `npm test` locally via test/e2e-gate.mjs, which
# SKIPs cleanly when the CLI is absent; this workflow keeps a separate, explicit
# signal for it rather than hiding it behind a green offline run.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  offline:
    name: Offline suites (hard gate)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          # No lockfile by design (the peerDependencies cannot resolve from any
          # registry), so the npm cache keys off package.json instead.
          cache: npm
          cache-dependency-path: package.json
      # The offline suites run on bare node (they import the src/*.ts sources
      # directly via native type stripping). This install exists for ONE suite:
      # build-gate, which runs the real tsdown build. --legacy-peer-deps is
      # mandatory — the plugin's peerDependencies are Host-runtime packages, and
      # a range install of them cannot succeed anyway (their published `latest`
      # tags are prereleases, which `>=0.1.5 <0.3` does not match under npm's
      # default semver rules).
      - name: Install dev dependencies (tsdown, for the build gate)
        run: npm install --legacy-peer-deps --no-audit --no-fund
      # The suites resolve the Host's own packages as PEERS through
      # test/peer-roots.mjs, and `--legacy-peer-deps` deliberately SKIPS peer
      # dependencies — so a clean runner has none, the FIRST peer-dependent suite
      # (`store.test.mjs`, second in the list below) threw
      # "cannot resolve the peer dependency @deepseek-ai/dsh-credentials", and
      # `set -e` then hid the other seventeen, on every push, for a day.
      #
      # Installing two or three packages from the registry does NOT fix it: the
      # DSH package set resolves its own internals through peers as well
      # (`dsh-credentials-local/lib/index.js` imports `@deepseek-ai/dsh-atomic-write`),
      # so a partial install only moves the failure. The complete,
      # version-consistent source is the CLI's own install tree — exactly what
      # the e2e job below already uses and what `cliRuntimeModules()` in
      # test/peer-roots.mjs now falls back to. Installed GLOBALLY on purpose:
      # a global install does not read this repo's manifest, so npm is free to
      # pull the runtime's own peer closure.
      - name: Provide the Host runtime the peer suites resolve from
        run: npm install -g @deepseek-ai/dsh || echo "dsh CLI not installable here; the peer suites will fail loudly (this gate must not pass without them)"
      - name: Run the offline suites
        run: |
          set -e
          node test/auth.test.mjs
          node test/store.test.mjs
          node test/store-baseline.test.mjs
          node test/routes.test.mjs
          node test/panel.test.mjs
          node test/render.test.mjs
          node test/parsers.test.mjs
          node test/provider.test.mjs
          node test/config.test.mjs
          node test/package.test.mjs
          node test/docs.test.mjs
          node test/wiring.test.mjs
          node test/contract.test.mjs
          node test/retry.test.mjs
          node test/error-fix.test.mjs
          node test/peer-contract.test.mjs
          node test/draw.test.mjs
          node test/doctor.test.mjs
          node test/raccoon.test.mjs
          # The typecheck gate is not a *.test.mjs (same exemption as the build
          # gate): it runs the local tsc pinned in devDependencies against
          # tsconfig.json, so the strict flags there cannot rot silently. It
          # SKIPs loudly when typescript is not installed — which CI always has,
          # because the dev-dependency step above installs it.
          node test/typecheck-gate.mjs
          # The build gate is not a *.test.mjs, so it stays outside the
          # three-way roster pin; it is listed here because CI is exactly
          # where the build must be proven (artifacts are gitignored, so a
          # fresh checkout has none until this build produces them).
          node test/build-gate.mjs

  e2e:
    name: End-to-end (best effort)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # The bundle's two entries are BUILT ARTIFACTS (`lib/index.js`, root
      # `client.js`) and both are gitignored — a fresh checkout has neither, so the
      # loader drops the entry with only "1 entry did not activate" in the boot log
      # and every API route falls through to the Host's default handler as a bare 401.
      # This job had no build step at all, so it was red on every run since the first
      # one: 35/44 checks, the very first of them the loader-activation check.
      - name: Install dev dependencies (tsdown, for the build)
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Build the artifacts the bundle ships
        run: npm run build
      # The e2e harness spawns `dsh web`; without the CLI the gate prints SKIP
      # and exits 0. Install it if a registry source is configured, otherwise
      # let the gate skip — the offline job above is the actual gate.
      - name: Provide the dsh CLI (if available)
        run: npm install -g @deepseek-ai/dsh || echo "dsh CLI not installable here; e2e will SKIP"
      - name: Run the end-to-end suite
        run: node test/e2e.mjs

  live-contract:
    name: Live platform contract (best effort)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # No dependencies to install (peerDependencies only — same as offline).
      # The key comes from the repo secret the owner injects; without it the
      # suite SKIPs loudly and exits 0 (`test/live-contract.mjs` header), the
      # same shape as the e2e gate's missing-dsh-CLI skip. Note this is NOT a
      # `*.test.mjs` line, so it stays out of the three-way roster pin.
      - name: Run the live platform contract
        run: node test/live-contract.mjs
        env:
          SENSENOVA_API_KEY: ${{ secrets.SENSENOVA_API_KEY }}
