#   "rate-limit hits back off on their own" — src/host/llm-retry.ts and src/host/codes.ts
#     classify rate limit vs drained pool before deciding whether to retry.
#   "usage pill, credit pools and per-model consumption" — src/client/composer-usage-pill.ts,
#     src/host/console-client.ts and src/client/cards.ts.
#   "Xiaohuanxiong … QR code … per-model credit multipliers" — src/host/raccoon-auth.ts,
