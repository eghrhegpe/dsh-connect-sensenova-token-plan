url: https://github.com/eghrhegpe/dsh-connect-sensenova-token-plan
name: eghrhegpe/dsh-connect-sensenova-token-plan
category: model
description:
  en: 'Bring the SenseNova language and text-to-image models into DSH as opt-in switches, off by default: image input and thinking levels are filled in automatically, and rate-limit hits back off on their own instead of reading as an exhausted quota. After signing in to the SenseNova console, the card shows the usage pill, credit pools and per-model consumption; Xiaohuanxiong can also be linked by QR code, with its models and per-model credit multipliers.'
  zh: '一键接入商汤 Token Plan的语言、文生图模型到 DSH，自动填入图片识别与思考强度（默认关）；限频时自动退避重试，不会误判为额度耗尽；登陆商汤控制台后，可查看卡片胶囊、积分池、每模型消耗。也支持扫码登陆小浣熊，接入其模型，查看模型消耗倍率。'
